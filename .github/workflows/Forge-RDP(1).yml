# Add this entire file to adeebkjan11-ctrl/Hh as .github/workflows/forge-rdp.yml.
# Keep the existing TAILSCALE_AUTH_KEY repository secret. Launch from Forge Agent 0.3.
name: Forge RDP
run-name: Forge ${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session identity generated by Forge
        required: true
        type: string
      public_key:
        description: Phone public key for encrypted pairing
        required: true
        type: string
permissions:
  contents: read
